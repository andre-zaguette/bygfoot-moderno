variables:
  UBUNTU_BUILD_DEPENDENCIES: libglib2.0-dev libgtk-3-dev libpango1.0-dev libatk1.0-dev libfreetype6-dev ninja-build cmake libjson-c-dev libsqlite3-dev
  DEBIAN_FRONTEND: noninteractive

stages:
  - build
  - test
  - compare
  - deploy
  - release

set-vars:
  stage: .pre
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release/
  variables:
    # We need the full checkout to ensure git describe always works.
    GIT_DEPTH: 0
  script:
    - |
      echo "BYGFOOT_VERSION=`git describe --tags`" >> set-vars.env
      # Use tilde versioning for the Debian and RPM packages (The gitlab generic
      # package registry does not support tildes in versions).
      echo "BYGFOOT_PKG_VERSION=`git describe --tags`" | sed 's/-/~/' >> set-vars.env
  artifacts:
    reports:
      dotenv: set-vars.env

clang-format:
  stage: build
  image: registry.fedoraproject.org/fedora:42
  rules:
    - if: $CI_MERGE_REQUEST_IID
  before_script:
    - |
      dnf install -y git-clang-format
  variables:
    # Add files here that are known to pass clang-format.  We want to make
    # sure we keep these files formatted correctly.
    CLANG_FORMAT_FILES: >-
      src/json_deserialize.*
      src/sqlite_data_store.*
      src/data_store_struct.h
  script:
    - |
      git-clang-format --diff $CI_MERGE_REQUEST_DIFF_BASE_SHA $CI_COMMIT_SHA -- $CLANG_FORMAT_FILES

gating-test:
  stage: build
  image: registry.fedoraproject.org/fedora:43
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release/
  needs:
    - job: clang-format
      optional: true
  variables:
    ASAN_OPTIONS: detect_leaks=0
  before_script:
    - |
      dnf install -y cmake sqlite-devel ninja-build gtk3-devel gettext gcc rpm-build json-c-devel libasan libubsan jq
  script:
    - |
      cmake -B build -G Ninja -S . -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
      ninja -v -C build
      ./test/benchmark.sh --verify ./build/bygfoot

.build-pkg:
  stage: build
  interruptible: true
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release/
  needs:
    - set-vars
    - gating-test
  script:
    - |
      mkdir build
      pushd build
      cmake -G Ninja -S .. -DBYGFOOT_VERSION=$BYGFOOT_VERSION -DCPACK_PACKAGE_VERSION=$BYGFOOT_PKG_VERSION -DCMAKE_INSTALL_PREFIX=/usr/ -DCPACK_SYSTEM_NAME=$OS_NAME
      ninja
      cpack -G $PKG_TYPE
      case "$PKG_TYPE" in
        "DEB")
          pkg_suffix=".deb"
          ;;
        "RPM")
          pkg_suffix=".rpm"
          ;;
      esac
      pkg_name=`ls *$pkg_suffix`
      mv $pkg_name ..
      popd
      echo $pkg_name > $OS_NAME.pkg

  artifacts:
    name: $OS_NAME-package
    # We can't use variables here or the artifacts won't appear in the
    # merge request UI. https://docs.gitlab.com/ee/ci/yaml/#artifacts
    paths:
      - "*.deb"
      - "*.rpm"
      - "*.pkg"
      - build/

.build-ubuntu-deb:
  extends: .build-pkg
  variables:
    BUILD_DEPENDENCIES: $UBUNTU_BUILD_DEPENDENCIES
    PKG_TYPE: DEB
    PKG_SUFFIX: .deb
  before_script:
    - |
      apt-get update
      apt-get -y install $BUILD_DEPENDENCIES

build-ubuntu-22.04:
  extends: .build-ubuntu-deb
  image: docker.io/ubuntu:22.04
  variables:
    OS_NAME: ubuntu-22.04

build-ubuntu-24.04:
  extends: .build-ubuntu-deb
  image: docker.io/ubuntu:24.04
  variables:
    OS_NAME: ubuntu-24.04

build-debian-stable:
  extends: .build-ubuntu-deb
  image: docker.io/debian:stable
  variables:
    OS_NAME: debian-stable

build-generic-deb:
  extends: .build-ubuntu-deb
  image: docker.io/ubuntu:22.04
  variables:
    OS_NAME: Linux-Deb

build-generic-rpm:
  extends: .build-pkg
  image: registry.fedoraproject.org/fedora:42
  variables:
    OS_NAME: Linux-RPM
    PKG_TYPE: RPM
    PKG_SUFFIX: .rpm
  before_script:
    - |
      dnf install -y cmake sqlite-devel ninja-build gtk3-devel gettext gcc rpm-build json-c-devel

build-fedora-42:
  extends: build-generic-rpm
  image: registry.fedoraproject.org/fedora:42
  variables:
    OS_NAME: fedora-42
  before_script:
    - |
      dnf install -y cmake ninja-build sqlite-devel gtk3-devel gettext gcc rpm-build json-c-devel

build-fedora-43:
  extends: build-fedora-42
  image: registry.fedoraproject.org/fedora:43
  variables:
    OS_NAME: fedora-43

build-mingw:
  stage: build
  interruptible: true
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release/
  image: registry.fedoraproject.org/fedora:43
  variables:
    OS_NAME: mingw
    BYGFOOT_MINGW: 1
  before_script:
    - |
      dnf install -y cmake ninja-build mingw64-json-c mingw64-sqlite-static mingw64-gcc mingw64-gtk3 mingw64-gettext mingw64-zlib git bzip2
  script:
    - |
      ./scripts/package.sh . bygfoot-$BYGFOOT_VERSION-mingw
      echo `ls *.tar.bz2` > $OS_NAME.pkg
  artifacts:
    name: $OS_NAME-package
    paths:
      - "*.tar.bz2"
      - "*.pkg"
  needs:
    - set-vars
    - gating-test

.test-ubuntu:
  stage: test
  interruptible: true
  only:
    - merge_requests
  before_script:
    - |
      apt-get update
      apt-get -y install $GTK_RUNTIME_PKG $LIBJSON_C_PKG unzip jq parallel
      dpkg -i *.deb
  script:
    - |
      bash ./test/test-load-save.sh /usr/bin//bygfoot
      bash ./test/test-country-defs.sh /usr/bin//bygfoot

test-ubuntu-22.04:
  extends: .test-ubuntu
  image: docker.io/ubuntu:22.04
  variables:
    GTK_RUNTIME_PKG: libgtk-3-0
    LIBJSON_C_PKG: libjson-c5
  needs:
   - build-ubuntu-22.04

test-ubuntu-24.04:
  extends: .test-ubuntu
  image: docker.io/ubuntu:24.04
  variables:
    GTK_RUNTIME_PKG: libgtk-3-0t64
    LIBJSON_C_PKG: libjson-c5
  needs:
   - build-ubuntu-24.04

test-debian-stable:
  extends: .test-ubuntu
  image: docker.io/debian:stable
  variables:
    GTK_RUNTIME_PKG: libgtk-3-0t64
    LIBJSON_C_PKG: libjson-c5
  needs:
    - build-debian-stable

test-dev-build:
  extends: test-ubuntu-22.04
  script:
    - |
      bash ./test/test-load-save.sh ./build/bygfoot
      bash ./test/test-country-defs.sh ./build/bygfoot
  needs:
    - build-ubuntu-22.04

test-fedora-42:
  extends: .test-ubuntu
  image: registry.fedoraproject.org/fedora:42
  before_script:
    - |
      dnf install -y sqlite-devel json-c gtk3 unzip diffutils jq parallel *.rpm
  needs:
    - build-fedora-42

test-fedora-43:
  extends: test-fedora-42
  image: registry.fedoraproject.org/fedora:43
  needs: 
    - build-fedora-43

.dump-sim:
  extends: test-fedora-43
  only:
    - merge_requests
  script:
    - |
      dnf install -y jq
      bash ./test/benchmark.sh --verify /usr/bin/bygfoot
      mv verify.log.gz $COMPARISON_NAME.log.gz
  artifacts:
    name: verify-$COMPARISON_NAME
    paths:
      - "*.log.gz"

dump-sim-new:
  extends: .dump-sim
  variables:
    COMPARISON_NAME: new

dump-sim-old:
  extends: .dump-sim
  variables:
    COMPARISON_NAME: old
  before_script:
    - |
      dnf install -y jq git
      sha=`git ls-remote $CI_MERGE_REQUEST_PROJECT_URL $CI_MERGE_REQUEST_TARGET_BRANCH_NAME | cut -f 1`
      read -r package_version package_id < <(curl "https://gitlab.com/api/v4/projects/bygfoot%2Fbygfoot/packages?package_name=fedora-43&sort=desc" | jq "[.[] | select(.pipeline.sha | contains (\"$sha\"))][0] | .version, .id" | xargs echo)
      file_name=`curl "https://gitlab.com/api/v4/projects/bygfoot%2Fbygfoot/packages/$package_id/package_files" | jq -r .[0].file_name`
      curl -O -L "https://gitlab.com/api/v4/projects/bygfoot%2Fbygfoot/packages/generic/fedora-43/$package_version/$file_name"
      dnf install -y sqlite-devel json-c gtk3 unzip diffutils $file_name


compare-sim:
  stage: compare
  only:
    - merge_requests
  needs:
    - dump-sim-new
    - dump-sim-old
  script:
    - |
      diff old.log.gz new.log.gz || echo $CI_MERGE_REQUEST_LABELS | grep 'sim-changes'

upload-packages:
  image: registry.fedoraproject.org/fedora:43
  stage: deploy
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release/
    - if: $CI_COMMIT_TAG
  script:
    - |
      for f in *.pkg; do
        os=`echo $f | sed 's/.pkg//g'`
        file=`cat $f`
        # Tilde not supported in package name:
        upload_name=`echo $file | sed 's/~/-/g'`
        echo ${PACKAGE_REGISTRY_URL}/${os}/${BYGFOOT_VERSION}/${upload_name}
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file $file ${PACKAGE_REGISTRY_URL}/${os}/${BYGFOOT_VERSION}/${upload_name}
      done

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      echo 'release-cli create --name "Release $CI_COMMIT_TAG" --tag-name $CI_COMMIT_TAG \' >> create-release.sh
      for f in *.pkg; do
        os=`echo $f | sed 's/.pkg//g'`
        # Tilde not supported in package name:
        file=`cat $f | sed 's/~/-/g'`
        echo --assets-link "'{\"name\":\"${file}\",\"url\":\"${PACKAGE_REGISTRY_URL}/${os}/${BYGFOOT_VERSION}/${file}\"}"\' \\ >> create-release.sh
      done
      echo " " >> create-release.sh
      cat create-release.sh
      /bin/sh create-release.sh
