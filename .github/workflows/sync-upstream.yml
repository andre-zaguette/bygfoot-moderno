# Semanalmente (e sob demanda) traz o main do upstream para upstream/ numa branch e abre um PR de rascunho com o resultado das seeds.
# Em push (alteração deste arquivo) roda em modo de ensaio: executa o sync no runner, sem enviar branch nem abrir PR.
name: sync-upstream
on:
  schedule: [{ cron: '0 6 * * 1' }]
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sync-upstream.yml', 'tools/sync-upstream.sh']
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DRY: ${{ github.event_name == 'push' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Dependências
        run: sudo apt-get update && sudo apt-get install -y cmake libgtk-3-dev libjson-c-dev libsqlite3-dev gettext pkg-config python3
      - name: Descobrir o commit novo do upstream
        id: up
        run: |
          git remote add upstream https://gitlab.com/bygfoot/bygfoot.git
          git fetch -q upstream master || git fetch -q upstream main
          NEW=$(git rev-parse FETCH_HEAD)
          PIN=$(sed -n 's/^commit //p' tools/upstream-pin.txt)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"; echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "$PIN" ]; then echo "sem commits novos no upstream"; echo "same=1" >> "$GITHUB_OUTPUT"; fi
      - name: Sincronizar
        id: sync
        if: steps.up.outputs.same != '1'
        run: |
          git config user.name "sync-upstream"; git config user.email "actions@users.noreply.github.com"
          git checkout -b "sync/upstream-$(echo ${{ steps.up.outputs.new }} | cut -c1-8)"
          sh tools/sync-upstream.sh "${{ steps.up.outputs.new }}" | tee sync-result.txt
          echo "result=$(tail -1 sync-result.txt)" >> "$GITHUB_OUTPUT"
      - name: Enviar branch e abrir PR de rascunho
        if: steps.up.outputs.same != '1' && env.DRY == ''
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          B="sync/upstream-$(echo ${{ steps.up.outputs.new }} | cut -c1-8)"
          git push origin "$B"
          gh pr create --draft --base main --head "$B" --title "chore(upstream): sincroniza com ${{ steps.up.outputs.new }}" \
            --body "Resultado das seeds de ouro: **${{ steps.sync.outputs.result }}**. Decisão de aceitar é humana: se as seeds mudaram, veja docs/adr/ADR-002 e a política de seeds."
