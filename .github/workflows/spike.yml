# Compila o upstream nos 3 sistemas, roda os testes e compara os hashes das seeds de ouro entre eles.
name: spike-headless
on: [push, pull_request]
jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependências (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake gtk+3 json-c
      - name: Dependências (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y cmake libgtk-3-dev libjson-c-dev libsqlite3-dev gettext pkg-config python3
      - name: Dependências (Windows, MSYS2)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-json-c mingw-w64-x86_64-sqlite3 mingw-w64-x86_64-gettext
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python make git diffutils
      - name: Compilar o upstream
        run: sh tools/build-upstream.sh
      - name: Verificar upstream intacto
        run: sh tools/verify-upstream-pristine.sh 9b7b0062
      - name: Testes do spike
        run: sh tests/spike/test-headless.sh
      - name: Testes de seeds de ouro (comparador)
        run: sh tests/golden-seeds/test-compare-golden.sh
      - name: Hashes das seeds de ouro
        run: python3 -I tools/golden-hash.py > golden-${{ matrix.os }}.txt && cat golden-${{ matrix.os }}.txt
      - name: Experimento ADR-002 - aplicar remendos em cópia e compilar
        run: |
          sh tools/apply-patches.sh build/patched-src
          BF_SRC=build/patched-src BF_BUILD=build/patched sh tools/build-upstream.sh build/patched-build.log
      - name: Experimento ADR-002 - hashes com remendo
        run: BYGFOOT_BIN="$PWD/build/patched/bygfoot" python3 -I tools/golden-hash.py > golden-patched-${{ matrix.os }}.txt && cat golden-patched-${{ matrix.os }}.txt
      - name: Diagnóstico (saída completa e ordem dos diretórios)
        if: always()
        run: |
          mkdir -p diag
          sh spike/headless/bf-headless --seed 0 > diag/out-${{ matrix.os }}.txt || true
          python3 -I -c "import os;[print(n) for n in os.listdir('upstream/support_files/definitions')]" > diag/readdir-definitions-${{ matrix.os }}.txt
      - name: Publicar hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.os }}
          path: |
            golden-${{ matrix.os }}.txt
            golden-patched-${{ matrix.os }}.txt
            diag/
  compare:
    needs: headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: golden
          merge-multiple: true
      - name: Comparar macOS, Linux e Windows (upstream original)
        continue-on-error: true   # divergência conhecida, ver docs/spikes/cross-os-determinism.md
        run: |
          ls -l golden
          python3 -I tools/compare-golden.py golden/golden-macos-latest.txt golden/golden-ubuntu-latest.txt golden/golden-windows-latest.txt
      - name: Comparar macOS, Linux e Windows (com remendos)
        run: python3 -I tools/compare-golden.py golden/golden-patched-macos-latest.txt golden/golden-patched-ubuntu-latest.txt golden/golden-patched-windows-latest.txt
