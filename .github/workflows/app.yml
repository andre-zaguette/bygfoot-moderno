# Fase 2: compila o motor remendado e testa o app (front-end, adaptador, casca Tauri) nos 3 sistemas.
name: app
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do motor (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake gtk+3 json-c
      - name: Dependências do motor e do Tauri (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: >-
          sudo apt-get update && sudo apt-get install -y cmake libgtk-3-dev libjson-c-dev libsqlite3-dev gettext
          pkg-config python3 libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Dependências do motor (Windows, MSYS2)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-json-c mingw-w64-x86_64-sqlite3 mingw-w64-x86_64-gettext
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python make git diffutils patch
      - name: Compilar o motor remendado (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          sh tools/apply-patches.sh build/patched-src
          BF_SRC=build/patched-src BF_BUILD=build/patched sh tools/build-upstream.sh build/patched-build.log
      - name: Compilar o motor remendado (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          sh tools/apply-patches.sh build/patched-src
          BF_SRC=build/patched-src BF_BUILD=build/patched sh tools/build-upstream.sh build/patched-build.log
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Front-end (instalar, tipos, testes, build)
        working-directory: app
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Rust (testes com o motor real)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = windows-latest ]; then
            # o wrapper precisa de sh/python3 e o motor das DLLs do MSYS2; no FIM do PATH para não sobrepor DLLs do sistema (o Tauri quebra: ENTRYPOINT_NOT_FOUND)
            MSYS="$(cygpath -u "$RUNNER_TEMP")/msys64"   # onde o setup-msys2 instala os pacotes
            [ -f "$MSYS/mingw64/bin/python3.exe" ] || { echo "MSYS2 com os pacotes não encontrado em $MSYS"; exit 1; }
            export PATH="$PATH:$MSYS/usr/bin:$MSYS/mingw64/bin"
            export BYGFOOT_BIN="$(cygpath -m "$PWD/build/patched/bygfoot.exe")"
          else
            export BYGFOOT_BIN="$PWD/build/patched/bygfoot"
          fi
          cargo test --workspace --locked
      - name: Compilar o app Tauri
        shell: bash
        run: cargo build -p bygfoot-moderno-app --locked
